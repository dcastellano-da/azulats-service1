# =============================================================================
# Workflow: Deploy to Staging (Proyecto A — azul-ats-1)
# Trigger : Push o merge a la rama 'develop'
# Región  : us-east1
# Nota    : Las pruebas unitarias son una barrera bloqueante.
#           Si npm test falla, el deploy NO se ejecuta.
# =============================================================================

name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  test-and-deploy-staging:
    name: Test → Deploy Staging
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar el entorno de ejecución Node.js 24
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Instalar dependencias exactas del lockfile (reproducible)
      - name: Install dependencies
        run: npm ci

      # 4. ── BARRERA DE CONTENCIÓN ─────────────────────────────────────────
      #    Si este paso falla, el workflow se cancela y el deploy NO ocurre.
      - name: Run unit tests
        run: npm test

      # 5. Autenticar en Google Cloud con la Service Account del Proyecto A
      - name: Authenticate to Google Cloud (Staging)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_STAGING }}

      # 6. Instalar y configurar Google Cloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 7. Desplegar en Cloud Run — Proyecto A (Staging)
      - name: Deploy to Cloud Run (Staging)
        run: |
          gcloud run deploy azulats-service1 \
            --source . \
            --region us-east1 \
            --project ${{ secrets.GCP_PROJECT_STAGING }} \
            --allow-unauthenticated \
            --set-env-vars NODE_ENV=staging,GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT_STAGING }},GCLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT_STAGING }},FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET_STAGING }},BIGQUERY_PROJECT_ID=${{ secrets.BIGQUERY_PROJECT_ID }} \
            --quiet

# =============================================================================
# Workflow: Deploy to Production (Proyecto B — azul-ats-prod)
# Trigger : Push o merge a la rama 'main' (via Pull Request aprobado)
# Región  : us-east1
# Nota    : Las pruebas unitarias son una barrera bloqueante.
#           Si npm test falla, el deploy NO se ejecuta.
#           ALLOWED_ORIGINS se inyecta estrictamente desde Secrets.
# =============================================================================

name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy-production:
    name: Test → Deploy Production
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar el entorno de ejecución Node.js 24
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Instalar dependencias exactas del lockfile (reproducible)
      - name: Install dependencies
        run: npm ci

      # 4. ── BARRERA DE CONTENCIÓN ─────────────────────────────────────────
      #    Si este paso falla, el workflow se cancela y el deploy NO ocurre.
      #    Las variables se inyectan aquí para que env.test.js pueda validarlas
      #    (incluye ALLOWED_ORIGINS porque el test lo verifica cuando NODE_ENV=production).
      - name: Run unit tests
        run: npm test
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT_PRODUCTION }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET_PRODUCTION }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS_PRODUCTION }}

      # 5. Autenticar en Google Cloud con la Service Account del Proyecto B
      - name: Authenticate to Google Cloud (Production)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PRODUCTION }}

      # 6. Instalar y configurar Google Cloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 7. Desplegar en Cloud Run — Proyecto B (Producción)
      #    ALLOWED_ORIGINS se inyecta estrictamente desde GitHub Secrets.
      #    NODE_ENV=production activa el CORS estricto (sin regex previews).
      - name: Deploy to Cloud Run (Production)
        run: |
          gcloud run deploy azulats-service1 \
            --source . \
            --region us-east1 \
            --project ${{ secrets.GCP_PROJECT_PRODUCTION }} \
            --allow-unauthenticated \
            --set-env-vars NODE_ENV=production,GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT_PRODUCTION }},GCLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT_PRODUCTION }},FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET_PRODUCTION }},BIGQUERY_PROJECT_ID=${{ secrets.BIGQUERY_PROJECT_ID }},ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS_PRODUCTION }} \
            --quiet
